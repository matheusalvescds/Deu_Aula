:root{

--target-min:2.75rem;
--control-height-sm:2.25rem;
--control-height:2.75rem;
--control-height-lg:3.25rem;
--icon-size-sm:1rem;--icon-size:1.25rem;--icon-size-lg:1.5rem;
--avatar-size-sm:1.75rem;--avatar-size:2.25rem;--avatar-size-lg:3rem;
--tabbar-height:4.25rem;
--topbar-height:3.5rem;
--sidebar-width:16rem;
--content-max:72rem;
--field-max:26rem;
}
:root{
--radius-2:0.125rem;--radius-4:0.25rem;--radius-8:0.5rem;--radius-12:0.75rem;
--radius-16:1rem;--radius-20:1.25rem;--radius-24:1.5rem;--radius-full:999px;

--radius-control:var(--radius-12);
--radius-field:var(--radius-8);
--radius-card:var(--radius-16);

}
:root{

--shadow-none:none;
--shadow-raised:0 1px 2px rgba(14,14,18,.06);

--shadow-dialog:0 24px 64px rgba(14,14,18,.18);
--shadow-tabbar:0 -1px 0 var(--grey-200);
--focus-ring-width:2px;

--focus-ring-shadow:0 0 0 var(--focus-ring-offset) var(--surface-card),0 0 0 calc(var(--focus-ring-offset) + var(--focus-ring-width)) var(--focus-ring);

--scrim-bottom:linear-gradient(to top,rgba(14,14,18,.78) 0%,rgba(14,14,18,.32) 42%,rgba(14,14,18,0) 100%); 
--scrim-flat:rgba(14,14,18,.48);
--blur-panel:saturate(140%) blur(12px); 
}
:root{
--duration-instant:80ms; 
--duration-fast:140ms; 
--duration-normal:220ms; 
--duration-slow:320ms; 
--ease-out:cubic-bezier(.2,0,0,1); 
--ease-in-out:cubic-bezier(.4,0,.2,1);

--transition-state:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out);

}

:root{
  --phone-w:378px; --phone-h:772px;
  --bezel:13px; --radius-screen:42px;

  /* ---- casca do protótipo (fora do celular) ----------------------------
     A moldura passa a ser uma superfície de acento: --blue-500 / #3535F0.
     Regra do DS (color-text-pairs): sobre o azul, texto sempre BRANCO PURO,
     nunca azul claro. A hierarquia vem do peso e do tamanho, não da opacidade.
     Alphas brancos só aparecem como SUPERFÍCIE (trilhos, hover), nunca como texto. */
  --shell-bg:var(--blue-500);
  --shell-fg:var(--text-on-accent);          /* 7.2:1 sobre #3535F0 — AA/AAA */
  --shell-surface-quiet:var(--white-alpha-12);
  --shell-surface-hover:var(--white-alpha-24);
  --shell-border:var(--white-alpha-24);
  --shell-focus:var(--focus-ring-inverted);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* ============================================================
   MODO APP (index.html?full=1 ou app.html)
   A tela do protótipo ocupa o aparelho inteiro: sem casca, sem
   moldura e sem barra lateral. Serve para abrir no celular e
   gravar a tela como se fosse o app publicado.
   ============================================================ */
body.full{padding:0;gap:0;display:block;background:var(--surface-page);min-height:100dvh}
body.full .rail, body.full .hint{display:none}
body.full .stage{gap:0}
body.full .device{padding:0;border-radius:0;background:none;box-shadow:none}
body.full .device::before, body.full .device::after{display:none}
body.full .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
body.full .phone::after{display:none}
body.full .status-inset{height:calc(var(--sp-6) + env(safe-area-inset-top, 0px))}
body.full .nav{padding-bottom:calc(var(--sp-6) + env(safe-area-inset-bottom, 0px))}
body.full .view{padding-bottom:var(--sp-6)}
/* área invisível de serviço: um toque aqui abre o seletor de perfil e telas,
   sem deixar nenhum botão visível na gravação */
body.full .devzone{position:fixed;left:0;top:0;width:3rem;height:3rem;z-index:40;
  background:transparent;border:0;padding:0}
.devsheet{position:fixed;inset:0;z-index:50;background:var(--overlay-scrim);
  display:flex;align-items:flex-end}
.devsheet .inner{width:100%;max-height:80dvh;overflow-y:auto;background:var(--surface-card);
  border-radius:var(--radius-card) var(--radius-card) 0 0;padding:var(--sp-8);
  display:flex;flex-direction:column;gap:var(--sp-6)}
.devsheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}

body{
  margin:0;padding:var(--sp-16);
  background:var(--shell-bg);color:var(--shell-fg);
  font-family:var(--font-text);font-size:var(--text-body-size);line-height:var(--leading-relaxed);
  -webkit-font-smoothing:antialiased;
  display:flex;gap:var(--sp-16);align-items:flex-start;min-height:100vh;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;transition:var(--transition-state)}
input,select,textarea{font-family:var(--font-text);color:inherit}
:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--focus-ring-offset)}
svg{flex:none}

/* ---------- rail ---------- */
.rail{width:17rem;flex:none;position:sticky;top:var(--sp-16);color:var(--shell-fg)}
.rail .mark{width:150px;margin-bottom:var(--sp-4);color:var(--shell-fg)}
.rail .mark svg{width:100%;height:auto;display:block}
/* o wordmark vem desenhado em ink-900; sobre o azul ele vira branco puro */
.rail .mark svg path{fill:currentColor}
.rail .sub{font-family:var(--font-display);font-weight:var(--weight-semibold);font-size:var(--text-micro-size);
  letter-spacing:var(--tracking-micro);text-transform:uppercase;color:var(--shell-fg);margin-bottom:var(--sp-12)}
.rail h2{font-family:var(--font-display);font-weight:var(--weight-semibold);font-size:var(--text-label-size);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--shell-fg);margin:0 0 var(--sp-4)}

/* papéis: padrão SegmentedControl do DS, invertido para superfície de acento */
.roles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-1);
  padding:var(--sp-1);background:var(--shell-surface-quiet);border-radius:var(--radius-control);
  margin-bottom:var(--sp-12)}
.roles button{padding:var(--sp-4) 0;text-align:center;font-size:var(--text-body-sm-size);font-weight:var(--weight-medium);
  border:0;border-radius:calc(var(--radius-control) - 2px);
  background:transparent;color:var(--shell-fg);min-height:2.25rem}
.roles button:hover{background:var(--shell-surface-hover)}
.roles button[aria-pressed="true"]{background:var(--surface-card);color:var(--blue-700);
  font-weight:var(--weight-semibold);box-shadow:var(--shadow-raised)}
.roles button[aria-pressed="true"]:hover{background:var(--surface-card)}

.idx{list-style:none;margin:0 0 var(--sp-12);padding:0}
.idx li{margin-bottom:var(--sp-1)}
.idx button{width:100%;display:flex;gap:var(--sp-6);align-items:baseline;padding:var(--sp-3) var(--sp-6);
  border-radius:var(--radius-field);font-size:var(--text-body-sm-size);color:var(--shell-fg)}
.idx button:hover{background:var(--shell-surface-quiet)}
.idx button[aria-current="true"]{background:var(--surface-card);color:var(--text-accent);font-weight:var(--weight-semibold);
  box-shadow:var(--shadow-raised)}
.idx button[aria-current="true"] .n{color:var(--text-accent)}
.idx .n{font-family:var(--font-mono);font-size:var(--text-micro-size);color:var(--shell-fg);min-width:1.1rem}
.log{border-top:1px solid var(--shell-border);padding-top:var(--sp-8)}
.log ul{list-style:none;margin:0;padding:0;font-size:var(--text-body-sm-size);color:var(--shell-fg)}
.log li{padding:var(--sp-2) 0;display:flex;gap:var(--sp-4)}
.log li b{color:var(--shell-fg);font-weight:var(--weight-semibold)}
/* .empty traz padding de 40px para o estado vazio de tela cheia; na coluna isso vira vão solto */
.log .empty{font-size:var(--text-body-sm-size);color:var(--shell-fg);padding:0;text-align:left}
/* atalho para a versão de tela cheia (app.html), na casca do protótipo */
.mobile-box{margin:var(--sp-8) 0 var(--sp-10);padding:var(--sp-6);border-radius:var(--radius-card);
  background:var(--white-alpha-12);border:1px solid var(--white-alpha-24);color:var(--shell-fg)}
.mobile-box .mb-head{display:flex;align-items:center;gap:var(--sp-3);margin:0 0 var(--sp-2);
  font-family:var(--font-display);font-size:var(--text-body-sm-size);font-weight:var(--weight-semibold)}
.mobile-box .ml-ic{flex:none;display:flex}
.mobile-box .mb-sub{margin:0 0 var(--sp-5);font-size:var(--text-micro-size);
  line-height:var(--leading-normal);opacity:.78}
.mobile-box .mb-links{display:flex;flex-direction:column;gap:var(--sp-3)}
.mobile-link{display:block;padding:var(--sp-4) var(--sp-6);border-radius:var(--radius-field);
  background:var(--white-alpha-12);border:1px solid var(--white-alpha-24);
  color:var(--shell-fg);text-decoration:none;text-align:center;
  font-family:var(--font-display);font-size:var(--text-body-sm-size);font-weight:var(--weight-semibold)}
.mobile-link:hover{background:var(--white-alpha-24)}
.reset{margin-top:var(--sp-8);font-size:var(--text-body-sm-size);color:var(--shell-fg);text-decoration:underline}

/* o anel de foco azul some sobre o azul — na casca ele é branco */
.rail :focus-visible,.stage>.hint :focus-visible{outline-color:var(--shell-focus)}

/* ---------- phone ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-8)}
/* ---- aparelho: carcaça, botões laterais e tela ---- */
.device{flex:none;position:relative;padding:var(--bezel);
  border-radius:calc(var(--radius-screen) + var(--bezel));
  background:linear-gradient(157deg,#3A3A46 0%,#0E0E12 38%,#17171D 68%,#2A2A33 100%);
  box-shadow:var(--shadow-dialog),inset 0 0 0 1px var(--white-alpha-12)}
/* botão de bloqueio (direita) */
.device::after{content:"";position:absolute;right:-2px;top:9.5rem;width:3px;height:4.5rem;
  border-radius:0 3px 3px 0;background:linear-gradient(180deg,#3A3A46,#17171D)}
/* silencioso + volume (esquerda) */
.device::before{content:"";position:absolute;left:-2px;top:6.5rem;width:3px;height:11.5rem;
  border-radius:3px 0 0 3px;
  background:linear-gradient(180deg,#3A3A46,#17171D) 0 0/3px 1.75rem no-repeat,
             linear-gradient(180deg,#3A3A46,#17171D) 0 3.25rem/3px 3.25rem no-repeat,
             linear-gradient(180deg,#3A3A46,#17171D) 0 7.5rem/3px 3.25rem no-repeat}
.phone{width:var(--phone-w);height:var(--phone-h);background:var(--surface-card);
  border-radius:var(--radius-screen);border:0;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  /* o protótipo em si permanece intocado: restaura a herança de cor original */
  color:var(--text-body)}
/* barra de gesto */
.phone::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:var(--sp-3);
  width:8.5rem;height:4px;border-radius:var(--radius-pill);background:var(--ink-900);
  opacity:.26;z-index:4;pointer-events:none}
/* faixa de status: recuo no topo da tela, sem ilha/câmera */
.status-inset{height:var(--sp-10);flex:none;background:var(--surface-page);position:relative;z-index:3}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--sp-2) var(--sp-8) var(--sp-8);
  background:var(--surface-page);display:flex;flex-direction:column}
.view>*{flex:none}
/* estado vazio ocupa a sobra e centraliza, em vez de ficar preso no topo
   de uma tela de 750px com 600px de branco embaixo */
.empty{margin-block:auto}
/* telas de ação única: o controle ocupa a sobra e fica no centro óptico.
   margin auto só age quando há folga — com a tela cheia o bloco volta ao fluxo. */
.rec-panel{border:1px dashed var(--border-default);border-radius:var(--radius-card);
  padding:var(--sp-12) var(--sp-8);text-align:center;margin-block:auto;
  display:flex;flex-direction:column;justify-content:center}
.view::-webkit-scrollbar{width:0}
.nav{flex:none;height:calc(var(--tabbar-height) + var(--sp-4));border-top:1px solid var(--border-hairline);
  display:flex;padding:var(--sp-4) var(--sp-2) var(--sp-8);background:var(--surface-card)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);
  font-family:var(--font-display);font-size:var(--text-micro-size);font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-micro);text-transform:uppercase;color:var(--icon-muted);border-radius:var(--radius-field)}
.nav button[aria-current="true"]{color:var(--text-accent)}
.hint{max-width:var(--phone-w);font-size:var(--text-body-sm-size);color:var(--shell-fg);text-align:center;min-height:2.5rem}

/* ---------- primitives ---------- */
.top{display:flex;align-items:center;gap:var(--sp-4);min-height:var(--topbar-height);padding-bottom:var(--sp-4)}
/* título de tela em azul; sobrescritas (.eyebrow) e apoio (.muted) seguem em cinza */
.top h3{font-family:var(--font-text);font-weight:var(--weight-semibold);font-size:var(--text-title-2-size);
  line-height:var(--leading-snug);color:var(--text-accent)}
.back{width:2.25rem;height:2.25rem;display:grid;place-items:center;margin-left:-.4rem;border-radius:var(--radius-field);color:var(--icon-default)}
/* Regra não-negociável do DS: nenhum alvo de toque abaixo de 44px.
   Os controles pequenos preservam o desenho e ganham área de toque invisível,
   em vez de engordar e estourar a densidade das telas. */
.view button,.nav button{position:relative}
.view button::after,.nav button::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:max(100%,var(--target-min));height:max(100%,var(--target-min))}
.back:hover{background:var(--action-quiet-bg-hover)}
.eyebrow{font-family:var(--font-display);font-weight:var(--weight-semibold);font-size:var(--text-label-size);
  line-height:1.2;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);
  margin-bottom:var(--sp-4)}
/* cabeçalho do feed: sobrescrita + título empilhados, etiqueta alinhada ao topo */
.feed-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-6);
  padding:var(--sp-2) 0 var(--sp-8)}
.feed-head .eyebrow{margin:0 0 var(--sp-2)}
.feed-head h3{font-family:var(--font-text);font-weight:var(--weight-semibold);
  font-size:var(--text-title-2-size);line-height:var(--leading-snug);color:var(--text-accent)}
.feed-head>*:last-child{flex:none;margin-top:var(--sp-1)}
/* a faixa rola na horizontal: esmaece na borda em vez de cortar a chip no meio */
.chips{display:flex;gap:var(--sp-3);overflow-x:auto;padding-bottom:var(--sp-6);scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent 100%);
  mask-image:linear-gradient(90deg,#000 calc(100% - 2rem),transparent 100%)}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;font-size:var(--text-body-sm-size);padding:var(--sp-3) var(--sp-6);border-radius:var(--radius-pill);
  border:1px solid var(--border-default);color:var(--text-body);background:var(--surface-card)}
.chip:hover{background:var(--action-secondary-bg-hover)}
.chip[aria-pressed="true"]{background:var(--action-bg);border-color:var(--action-bg);color:var(--action-fg)}
.card{background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:var(--pad-card)}
.card + .card{margin-top:var(--sp-4)}
.tag{display:inline-block;font-family:var(--font-display);font-size:var(--text-micro-size);font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-label);text-transform:uppercase;padding:var(--sp-2) var(--sp-4);
  border-radius:var(--radius-pill);background:var(--status-highlight-bg);color:var(--status-highlight-fg)}
.tag.g{background:var(--status-published-bg);color:var(--status-published-fg)}
.tag.a{background:var(--status-review-bg);color:var(--status-review-fg)}
.tag.c{background:var(--status-changes-bg);color:var(--status-changes-fg)}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-4);width:100%;min-height:var(--control-height);
  padding:var(--sp-4) var(--sp-8);border-radius:var(--radius-control);background:var(--action-bg);color:var(--action-fg);
  font-size:var(--text-body-size);font-weight:var(--weight-semibold)}
.btn:hover{background:var(--action-bg-hover)}
.btn:active{background:var(--action-bg-active)}
.btn.ghost{background:var(--action-secondary-bg);border:1px solid var(--action-secondary-border);color:var(--action-secondary-fg)}
.btn.ghost:hover{background:var(--action-secondary-bg-hover)}
.btn.ok{background:var(--green-600)}
.btn.ok:hover{background:var(--green-700)}
.btn.sm{min-height:var(--control-height-sm);padding:var(--sp-3) var(--sp-6);font-size:var(--text-body-sm-size);border-radius:var(--radius-field)}
.btn[disabled]{background:var(--disabled-bg);color:var(--disabled-fg);cursor:not-allowed}
.btn[disabled]:hover{background:var(--disabled-bg)}
/* check-in: três opções de mesma largura e mesma altura, com texto que pode
   quebrar em duas linhas sem desalinhar a linha de botões */
.checkin-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);align-items:stretch}
.checkin-opts .btn{min-height:2.75rem;padding:var(--sp-3) var(--sp-2);width:100%;
  font-size:var(--size-12);line-height:1.2;text-align:center;overflow-wrap:anywhere}
.field{margin-bottom:var(--sp-6)}
.field label{display:block;font-size:var(--text-label-size);color:var(--field-label);margin-bottom:var(--sp-3);font-weight:var(--weight-medium)}
.field input,.field textarea,.field select{width:100%;font-family:var(--font-text);font-size:var(--text-body-size);color:var(--field-text);
  min-height:var(--control-height);padding:var(--sp-4) var(--sp-6);border:1px solid var(--field-border);
  border-radius:var(--radius-field);background:var(--field-bg)}
.field input:hover,.field textarea:hover,.field select:hover{border-color:var(--field-border-hover)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--field-border-focus)}
.field input[readonly]{background:var(--field-bg-disabled);color:var(--text-muted)}
.field textarea{resize:vertical;min-height:4.5rem;line-height:var(--leading-relaxed)}
.field ::placeholder{color:var(--field-placeholder)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.stat{background:var(--surface-sunken);border-radius:var(--radius-control);padding:var(--sp-4)}
.stat span{display:block;font-family:var(--font-display);font-size:var(--text-micro-size);font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}
.stat b{font-family:var(--font-mono);font-size:var(--size-20);font-weight:var(--weight-semibold);color:var(--text-strong)}
.row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-6)}
.muted{font-size:var(--text-body-sm-size);color:var(--text-muted);line-height:var(--leading-normal)}
.avatar{border-radius:var(--radius-pill);flex:none;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:var(--weight-semibold);letter-spacing:.02em}
.thumb{border-radius:var(--radius-media);background:var(--grey-100);display:grid;place-items:center;color:var(--icon-muted);flex:none}
/* palco do feed: o player e os dois vizinhos vivem aqui dentro, e é este
   bloco que recorta a transição vertical no estilo dos feeds de vídeo */
.pstage{flex:1 1 auto;min-height:20rem;position:relative;overflow:hidden;
  border-radius:var(--radius-panel);background:var(--surface-panel-ink);touch-action:pan-x}
.pstage .player{position:absolute;inset:0;flex:none;min-height:0;border-radius:0;will-change:transform}
.pstage .peek{position:absolute;inset:0;z-index:1;background:#000 center/cover no-repeat;
  border-radius:0;will-change:transform}
.pstage .peek.up{transform:translateY(-100%)}
.pstage .peek.down{transform:translateY(100%)}
.pstage .peek::after{content:"";position:absolute;inset:0;background:var(--ink-900);opacity:.25}
.pstage.glide .player, .pstage.glide .peek{transition:transform var(--duration-normal) cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){.pstage.glide .player,.pstage.glide .peek{transition:none}}
.player{flex:1 1 auto;min-height:20rem;border-radius:var(--radius-panel);
  background:radial-gradient(120% 80% at 50% 28%,var(--ink-700) 0%,rgba(38,38,47,0) 62%),var(--surface-panel-ink);
  color:var(--text-inverted);position:relative;overflow:hidden}
.player .meta{position:absolute;left:var(--sp-8);right:7rem;bottom:var(--sp-8);z-index:2}
.player .meta-tags{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-4)}
.player .meta h4{font-family:var(--font-text);font-size:var(--text-title-3-size);font-weight:var(--weight-semibold);
  line-height:var(--leading-snug);margin:0 0 var(--sp-2);color:var(--white)}
.player .meta p{font-size:var(--text-body-sm-size);color:var(--text-inverted-muted)}
.player .scrim{position:absolute;inset:0;background:var(--scrim-bottom);z-index:1}
/* com foto de capa o --scrim-bottom sozinho não segura: a coluna de ações e os
   botões de navegação ficam sobre áreas claras da imagem. Véu no topo, reforço
   embaixo e lavagem na borda direita, tudo em ink, para o texto branco manter AA. */
.player .scrim.on-photo{background:
  linear-gradient(to bottom,rgba(14,14,18,.62) 0%,rgba(14,14,18,.30) 18%,rgba(14,14,18,0) 40%),
  radial-gradient(105% 75% at 100% 72%,rgba(14,14,18,.66) 0%,rgba(14,14,18,0) 62%),
  linear-gradient(to top,rgba(14,14,18,.86) 0%,rgba(14,14,18,.62) 30%,rgba(14,14,18,.28) 58%,rgba(14,14,18,0) 82%)}
/* largura fixa: sem isso o rótulo "Referência" estourava a caixa e invadia a legenda */
.player .rail-actions{position:absolute;right:var(--sp-4);bottom:var(--sp-8);z-index:2;width:5.5rem;
  display:flex;flex-direction:column;gap:var(--sp-8);align-items:center}
.player .rail-actions button{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  color:var(--icon-inverted);font-family:var(--font-display);font-size:var(--text-micro-size);
  font-weight:var(--weight-semibold);letter-spacing:var(--tracking-normal);text-transform:uppercase;
  min-height:2.75rem;justify-content:center;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.player .swipe{position:absolute;top:var(--sp-6);right:var(--sp-6);z-index:2;display:flex;gap:var(--sp-3)}
.player .swipe button{width:2.75rem;height:2.75rem;border-radius:var(--radius-pill);background:var(--white-alpha-12);
  border:1px solid var(--border-inverted);display:grid;place-items:center;color:var(--icon-inverted)}
.player .swipe button:hover{background:var(--white-alpha-24)}
/* vídeo real no feed: o <video> é um nó persistente movido para .vid-slot em cada
   render, então trocar de tela não reinicia a reprodução */
.player .vid-slot{position:absolute;inset:0;z-index:0;background:#000 center/cover no-repeat}
.player .vid-slot video{width:100%;height:100%;object-fit:cover;display:block}
.player .tapzone{position:absolute;inset:0;z-index:2;touch-action:none;cursor:pointer}
.player .bigplay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;
  color:var(--icon-inverted);pointer-events:none;opacity:0;transition:opacity .18s}
.player .bigplay.show{opacity:.92}
.player .bigplay span{width:4.5rem;height:4.5rem;border-radius:var(--radius-pill);
  background:var(--white-alpha-24);display:grid;place-items:center}
.player.has-video .meta{bottom:4.25rem}
.player.has-video .rail-actions{bottom:4.25rem}
.player .pbar{position:absolute;left:var(--sp-6);right:var(--sp-6);bottom:var(--sp-4);z-index:3;
  display:flex;align-items:center;gap:var(--sp-4);touch-action:none}
.player .pbar .track{position:relative;flex:1;height:1.25rem;display:flex;align-items:center;cursor:pointer}
.player .pbar .track b{position:absolute;left:0;right:0;height:.25rem;border-radius:var(--radius-pill);
  background:var(--white-alpha-24)}
.player .pbar .track i{position:absolute;left:0;height:.25rem;width:0;border-radius:var(--radius-pill);
  background:var(--white)}
.player .pbar .track u{position:absolute;width:.875rem;height:.875rem;margin-left:-.4375rem;
  border-radius:50%;background:var(--white);left:0}
.player .pbar em{font-family:var(--font-display);font-size:var(--text-micro-size);font-style:normal;
  color:var(--text-inverted);min-width:5.25rem;text-align:right;letter-spacing:.02em}
.player .hintswipe{position:absolute;left:0;right:0;top:var(--sp-6);z-index:2;text-align:center;
  font-size:var(--text-micro-size);color:var(--text-inverted-muted);pointer-events:none}
.note{display:flex;gap:var(--sp-4);padding:var(--sp-4) 0;border-bottom:1px solid var(--border-hairline)}
.note:last-child{border-bottom:0}
.note .body{flex:1;min-width:0}
.note .who{font-family:var(--font-display);font-size:var(--text-micro-size);font-weight:var(--weight-semibold);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--sp-2)}
.note .txt{font-size:var(--text-body-sm-size);line-height:var(--leading-relaxed);color:var(--text-body)}
.rec{width:4.5rem;height:4.5rem;border-radius:var(--radius-pill);background:var(--red-600);margin:0 auto;
  display:grid;place-items:center;border:4px solid var(--red-100)}
.rec.on{border-radius:var(--radius-16);width:3.75rem;height:3.75rem}
.timer{font-family:var(--font-mono);font-size:var(--size-28);font-weight:var(--weight-semibold);
  text-align:center;color:var(--text-strong);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--grey-200);overflow:hidden}
.bar i{display:block;height:100%;background:var(--action-bg)}
.empty{text-align:center;padding:var(--sp-20) var(--sp-8)}
.empty h4{font-family:var(--font-text);font-size:var(--text-title-3-size);font-weight:var(--weight-semibold);
  color:var(--text-strong);margin-bottom:var(--sp-4)}
.toast{position:absolute;left:var(--sp-8);right:var(--sp-8);bottom:5.5rem;z-index:5;
  background:var(--surface-panel-ink);color:var(--text-inverted);border-radius:var(--radius-control);
  padding:var(--sp-6);font-size:var(--text-body-sm-size);display:flex;gap:var(--sp-4);align-items:center;
  box-shadow:var(--shadow-menu)}
.switch{width:2.75rem;height:1.5rem;border-radius:var(--radius-pill);background:var(--grey-300);position:relative;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:1.125rem;height:1.125rem;border-radius:var(--radius-pill);
  background:var(--white);transition:left var(--duration-fast) var(--ease-out)}
.switch[aria-pressed="true"]{background:var(--action-bg)}
.switch[aria-pressed="true"] i{left:1.375rem}
.slider{width:100%;accent-color:var(--blue-500)}
.turma{display:block;width:100%;background:var(--surface-card);border:1px solid var(--border-hairline);
  border-radius:var(--radius-card);padding:var(--pad-card);margin-bottom:var(--sp-4)}
.turma:hover{border-color:var(--border-strong)}
.turma.on{border-color:var(--border-accent);background:var(--surface-accent-soft)}
.aurora{background:var(--aurora-wash);border-radius:var(--radius-panel);padding:var(--sp-10) var(--sp-8);margin-bottom:var(--sp-8)}
/* o wordmark vem desenhado em ink-900; na aurora ele é o azul da marca */
.logo-mark{width:100%;max-width:13rem}
.logo-mark svg{width:100%;height:auto;display:block}
.logo-mark svg path{fill:var(--blue-500)}
/* login: a marca sobe e ganha corpo, e o bloco de abertura ocupa o vão do topo
   em vez de a tela inteira ficar centralizada com folga sobrando dos dois lados */
.screen-fill{display:flex;flex-direction:column;min-height:100%}
/* Cabeçalho de marca sangrado até as bordas da tela — as margens negativas
   cancelam o padding do .view. Ele assume a sobra vertical: área de marca com
   respiro é superfície intencional, enquanto um cartão esticado com vazio
   dentro lê como buraco. Toda a folga vive aqui, então não sobra vão nenhum
   entre o formulário e o rodapé. */
.login-hero{flex:1 1 auto;max-height:18rem;
  margin:calc(var(--sp-2) * -1) calc(var(--sp-8) * -1) 0;
  padding:var(--sp-16) var(--sp-8) var(--sp-12);
  border-radius:0 0 var(--radius-panel) var(--radius-panel);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  /* wash na intensidade dos tons -200 sobre blue-50: na escala de um header
     a lavagem -100 do --aurora-wash some e a área volta a parecer vazia */
  background:radial-gradient(85% 110% at 8% 0%,var(--peach-200) 0%,rgba(251,224,203,0) 58%),
             radial-gradient(75% 100% at 96% 12%,var(--lilac-200) 0%,rgba(226,222,251,0) 60%),
             radial-gradient(95% 85% at 45% 100%,var(--cream-200) 0%,rgba(250,241,223,0) 68%),
             var(--blue-50)}
.login-hero .logo-mark{max-width:15rem;margin:0 auto var(--sp-8)}
.login-hero p{margin:0;max-width:17rem}
.login-form{margin-top:var(--sp-10)}
/* a nota acompanha o formulário. Com o formulário no alto, a folga que sobra
   fica na borda inferior da tela — onde não separa nada — em vez de abrir
   um intervalo entre os botões e o texto */
.screen-foot{margin-top:var(--sp-12)}

@media (max-width:900px){
  body{flex-direction:column;align-items:center;padding:var(--sp-8);gap:var(--sp-12)}
  .rail{width:100%;max-width:var(--phone-w);position:static}
}

/* posters de exemplo dos vídeos (fotos reais de alunos gravando) */
.thumb.ph,.player .poster{background-size:cover;background-position:center}
.thumb.ph{position:relative;color:var(--white)}
.thumb.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(14,14,18,.26)}

  function idx(l, id) { for (var i = 0; i < l.length; i++) if (l[i].id === id) return i; return -1; }

        '>' + S.instituicoes[i].nome + '</option>';

    return null;

  function rosterOf(nome) {
    var k, i;
    for (k in S.roster) {
      if (!S.roster.hasOwnProperty(k)) continue;
      for (i = 0; i < S.roster[k].length; i++) if (S.roster[k][i].nome === nome) return S.roster[k][i];
    }
    return null;

    return S.duvidas.filter(function (d) {
      return d.status === "professor" && d.disciplina === S.prof.disciplina;

  function partOf(t) {
    var r = S.roster[t] || [], i, m = 0;

    return Math.round(m / r.length);

  function visibleFeed() {

        '<span class="n">' + (i + 1) + '</span><span>' + list[i][1] + '</span></button></li>';
    }
    var mlA = document.getElementById("mobile-aluno"), mlP = document.getElementById("mobile-prof");
    if (mlA) mlA.href = "app.html?perfil=aluno&tela=" + (S.role === "aluno" ? S.screen : "feed");
    if (mlP) mlP.href = "app.html?perfil=professor&tela=" + (S.role === "professor" ? S.screen : "pfeed");
    document.getElementById("idx").innerHTML = h;

    if (!S.log.length) {
      document.getElementById("log").innerHTML = '<p class="empty">Nada ainda. Envie um vídeo como aluno e aprove como professor para ver o ciclo fechar.</p>';
    } else {
      h = "<ul>";
      for (i = 0; i < S.log.length; i++) h += "<li><b>" + esc(S.log[i].who) + "</b><span>" + esc(S.log[i].text) + "</span></li>";
      document.getElementById("log").innerHTML = h + "</ul>";
    }
  }

  function renderNav() {
    var el = document.getElementById("nav");
    if (!S.role || (S.role === "aluno" && !S.turmaAtual)) { el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "flex";
    var items = NAVS[S.role], i, h = "";
    var map = {
      feed: "feed", video: "feed", desafios: "desafios", gravar: "desafios", upload: "desafios",
      revisar: "desafios", enviado: "meus", meus: "meus",
      duvida: "duvidas", duvidas: "duvidas",
      perfil: "perfil", editarperfil: "perfil", pontos: "perfil",
      pfeed: "pfeed", curadoria: "curadoria", devolver: "curadoria", painel: "painel",
      alunodetalhe: "painel", novodesafio: "painel", pperfil: "pperfil", peditar: "pperfil",
      pduvidas: "pduvidas", presponder: "pduvidas",
      escola: "escola", turmas: "turmas", novaturma: "turmas", relatorio: "relatorio"
    };
    var active = map[S.screen] || items[0].s;
    for (i = 0; i < items.length; i++) {
      var cnt = 0;
      if (items[i].s === "curadoria") cnt = S.fila.length;
      if (items[i].s === "pduvidas") cnt = pendDuvidas();
      if (items[i].s === "duvidas") cnt = S.duvidas.filter(function (d) { return d.status === "respondida"; }).length;
      var badge = cnt
        ? '<span style="position:absolute;top:-2px;right:-9px;background:var(--text-error);color:#fff;border-radius:var(--radius-8);font-size:var(--size-11);padding:var(--sp-1) var(--sp-3)">' + cnt + '</span>' : "";
      h += '<button aria-current="' + (active === items[i].s) + '" onclick="App.a.go(\'' + items[i].s + '\')">' +
        '<span style="position:relative;display:inline-flex">' + ic(items[i].i, 21) + badge + '</span>' + items[i].l + '</button>';
    }
    el.innerHTML = h;
  }

  /* ---------------- vídeo do feed ---------------- */

  var VP = null, dragging = false;

  function raf(fn) {
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(fn);
    else setTimeout(fn, 16);
  }

  function tryPlay() {
    if (!VP) return;
    var p = VP.play();
    if (p && p.catch) p.catch(function () {
      if (!VP.muted) {
        S.muted = true;
        VP.muted = true;
        var q = VP.play();
        if (q && q.catch) q.catch(function () { S.playing = false; paintPlay(); });
        return;
      }
      S.playing = false;
      paintPlay();
    });
  }
  A.toggleMute = function () {
    S.muted = !S.muted;
    if (VP) VP.muted = S.muted;
    if (!S.playing) { S.playing = true; }
    render();
    if (VP) tryPlay();
  };
  function paintPlay() {
    var b = document.getElementById("bigplay");
    if (b) b.className = "bigplay" + (S.playing ? "" : " show");
  }
  function paintProgress() {
    if (!VP) return;
    var f = document.getElementById("pbar-fill"), k = document.getElementById("pbar-knob"), t = document.getElementById("pbar-time");
    if (!f || !VP.duration || !isFinite(VP.duration)) return;
    var pc = Math.max(0, Math.min(100, VP.currentTime / VP.duration * 100));
    f.style.width = pc + "%";
    if (k) k.style.left = pc + "%";
    if (t) t.textContent = fmt(Math.floor(VP.currentTime)) + " / " + fmt(Math.floor(VP.duration));
  }
  function seekFrom(ev, track) {
    if (!VP || !VP.duration || !isFinite(VP.duration)) return;
    var r = track.getBoundingClientRect();
    var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    VP.currentTime = Math.max(0, Math.min(1, x / r.width)) * VP.duration;
    paintProgress();
  }
  function mountVideo() {
    var slot = document.getElementById("vid-slot");
    if (!slot) { if (VP) VP.pause(); return; }
    if (!VP) {
      VP = document.createElement("video");
      VP.setAttribute("playsinline", "");
      VP.setAttribute("webkit-playsinline", "");
      VP.preload = "auto";
      VP.loop = true;
      VP.muted = true;
      VP.addEventListener("timeupdate", paintProgress);
      VP.addEventListener("error", function () {
        var slot = document.getElementById("vid-slot");
        if (!slot) return;
        slot.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;' +
          'align-items:center;gap:var(--sp-4);padding:var(--sp-8);text-align:center;color:#fff">' +
          ic("alert", 28) + '<b style="font-size:var(--size-13)">Vídeo não encontrado</b>' +
          '<span style="font-size:var(--size-11);opacity:.75;line-height:1.4">' + esc(VP.getAttribute("data-src") || "") +
          '<br>Coloque a pasta <b>videos</b> na mesma pasta do index.html.</span></div>';
        if (VP.parentNode === slot) slot.appendChild(VP);
      });
      VP.addEventListener("loadedmetadata", paintProgress);
    }
    slot.appendChild(VP);
    var src = slot.getAttribute("data-src"), poster = slot.getAttribute("data-poster") || "";
    if (poster) slot.style.backgroundImage = 'url("' + poster + '")';
    if (VP.getAttribute("data-src") !== src) {
      VP.setAttribute("data-src", src);
      VP.poster = poster;
      VP.src = src;
    }
    VP.muted = !!S.muted;
    if (S.playing) tryPlay(); else VP.pause();
    paintPlay();
    paintProgress();

    var stg = document.getElementById("pstage"), plr = document.getElementById("player");
    if (stg && plr && S._dir) {
      var hh = stg.offsetHeight || 520;
      plr.style.transform = "translateY(" + (S._dir > 0 ? hh : -hh) + "px)";
      S._dir = 0;
      // dois quadros de folga para o navegador registrar a posição inicial
      raf(function () {
        raf(function () {
          stg.className = "pstage glide";
          plr.style.transform = "translateY(0px)";
          setTimeout(function () { stg.className = "pstage"; }, 260);
        });
      });
    }

    var tap = document.getElementById("tapzone"), y0 = 0, t0 = 0, moved = false, drag = false;
    var stage = document.getElementById("pstage"), pl = document.getElementById("player");
    var pu = document.getElementById("peek-up"), pd = document.getElementById("peek-down");

    function put(dy) {
      var h = stage ? stage.offsetHeight || 520 : 520;
      if (pl) pl.style.transform = "translateY(" + dy + "px)";
      if (pu) pu.style.transform = "translateY(" + (dy - h) + "px)";
      if (pd) pd.style.transform = "translateY(" + (dy + h) + "px)";
    }
    function settle(dir) {
      var h = stage ? stage.offsetHeight || 520 : 520;
      if (stage) stage.className = "pstage glide";
      if (dir === 0) { put(0); setTimeout(function () { if (stage) stage.className = "pstage"; }, 240); return; }
      // o vídeo atual sai e o vizinho ocupa a tela antes de o app trocar de item
      put(dir > 0 ? -h : h);
      setTimeout(function () { A.step(dir > 0 ? 1 : -1); }, 220);
    }
    if (tap) {
      tap.addEventListener("pointerdown", function (e) {
        y0 = e.clientY; t0 = Date.now(); moved = false; drag = true;
        if (stage) stage.className = "pstage";
        tap.setPointerCapture && tap.setPointerCapture(e.pointerId);
      });
      tap.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var dy = e.clientY - y0;
        if (Math.abs(dy) > 8) { moved = true; put(dy); }
      });
      tap.addEventListener("pointerup", function (e) {
        if (!drag) return;
        drag = false;
        var dy = e.clientY - y0, dt = Date.now() - t0;
        var h = stage ? stage.offsetHeight || 520 : 520;
        var rapido = Math.abs(dy) > 40 && dt < 260;
        if (moved && (Math.abs(dy) > h * 0.22 || rapido)) { settle(dy < 0 ? 1 : -1); return; }
        if (moved) { settle(0); return; }
        if (dt < 400) A.togglePlay();
      });
      tap.addEventListener("pointercancel", function () { if (drag) { drag = false; settle(0); } });
      tap.addEventListener("wheel", function (e) {
        if (Math.abs(e.deltaY) < 24) return;
        e.preventDefault();
        if (wheelLock) return;
        wheelLock = true;
        setTimeout(function () { wheelLock = false; }, 520);
        settle(e.deltaY > 0 ? 1 : -1);
      }, { passive: false });
    }
    var track = document.getElementById("pbar-track");
    if (track) {
      track.addEventListener("pointerdown", function (e) {
        dragging = true;
        track.setPointerCapture && track.setPointerCapture(e.pointerId);
        seekFrom(e, track);
      });
      track.addEventListener("pointermove", function (e) { if (dragging) seekFrom(e, track); });
      track.addEventListener("pointerup", function () { dragging = false; });
      track.addEventListener("pointercancel", function () { dragging = false; });
      track.addEventListener("keydown", function (e) {
        if (!VP || !VP.duration) return;
        if (e.key === "ArrowRight") { VP.currentTime = Math.min(VP.duration, VP.currentTime + 2); paintProgress(); }
        if (e.key === "ArrowLeft") { VP.currentTime = Math.max(0, VP.currentTime - 2); paintProgress(); }
      });
    }
  }
  var wheelLock = false;

  function render() {
    var fn = V[S.screen] || V.feed;
    document.getElementById("view").innerHTML = fn();
    document.getElementById("toast").innerHTML = S.toast ? '<div class="toast">' + ic("check", 17) + '<span>' + esc(S.toast) + '</span></div>' : '';
    document.getElementById("hint").textContent = HINTS[S.screen] || "";
    renderRail();
    renderNav();
    mountVideo();
  }

  /* ---------------- modo app (tela cheia) ---------------- */

  function qp(k) {
    var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  function isFull() {
    return /(^|[?&])full=1/.test(location.search) || location.hash === "#app";
  }
  A.devSheet = function (open) {
    var el = document.getElementById("devsheet");
    if (!el) return;
    if (!open) { el.innerHTML = ""; return; }
    var roles = [["aluno", "Aluno"], ["professor", "Professor"], ["escola", "Escola"]], i, h = "";
    for (i = 0; i < roles.length; i++) {
      h += '<button class="btn' + (S.role === roles[i][0] ? '' : ' ghost') + ' sm" onclick="App.a.devGo(\'' + roles[i][0] + '\')">' + roles[i][1] + '</button>';
    }
    var list = INDEX[S.role] || INDEX.aluno, t = "";
    for (i = 0; i < list.length; i++) {
      t += '<button class="btn ghost sm" style="justify-content:flex-start" onclick="App.a.devScreen(\'' + list[i][0] + '\')">' + list[i][1] + '</button>';
    }
    el.innerHTML = '<div class="devsheet" onclick="if(event.target===this)App.a.devSheet(0)"><div class="inner">' +
      '<p class="ex-label">Perfil</p><div class="grid">' + h + '</div>' +
      '<p class="ex-label">Telas</p><div class="grid">' + t + '</div>' +
      '<button class="btn ghost" onclick="App.a.devSheet(0)">Fechar</button></div></div>';
  };
  A.devGo = function (r) { A.devSheet(0); setRole(r); };
  A.devScreen = function (t) { A.devSheet(0); go(t); };

  function applyFull() {
    if (!isFull()) return;
    document.body.className = "full";
    var r = qp("perfil"), t = qp("tela");
    if (r && INDEX[r]) { S.role = r; S.screen = INDEX[r][0][0]; }
    if (t) S.screen = t;
  }

  A.go = go;
  A.setRole = setRole;
  A.reset = function () { clearInterval(S._t); S = seed(); render(); };

  window.App = { a: A, reset: function () { A.reset(); }, state: function () { return S; } };
  applyFull();
  render();
})();

</script>
</body>
</html>
